permissions:
  contents: read # required to checkout the code from the repo
  packages: write # required for push to GHCR
name: Test, Build and Push
# Only run one instance at a time for a given branch
concurrency: ci-${{ github.ref }}
on:
  push:
  workflow_dispatch:
jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263 # v1.4.2
        with:
          virtualenvs-create: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: "poetry"
      # Install dependencies. `--no-root` means "install all dependencies but not the project
      # itself
      - run: poetry install --no-interaction --no-root
      # Install
      - run: poetry install --no-interaction
      # Lint check
      - run: poetry run ruff check kollie tests
      # Type check
      - run: poetry run mypy .
      # Test
      - run: poetry run pytest
        env:
          APPLICATION_STAGE: test
          KOLLIE_COMMON_SUBSTITUTIONS_JSON_PATH: tests/test_common_substitutions.json
          KOLLIE_DEFAULT_FLUX_REPOSITORY: test-repo
  build:
    name: Build and Push
    runs-on: ubuntu-latest
    needs: [test]
    timeout-minutes: 15
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Login to ghcr.io
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=false
          tags: |
            type=sha,format=long,prefix={{branch}}-,suffix=-{{date 'X'}},priority=1500,enable=${{ github.ref_type == 'branch' }}
            type=sha,format=long,prefix=
            type=ref,event=branch
            type=ref,event=tag
      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          target: deploy
          platforms: |
            linux/amd64
            linux/arm64
          push: true
